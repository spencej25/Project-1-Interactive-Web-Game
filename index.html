<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="startBtn" onclick="startGame(); this.style.display='none';">
  Start Game
</button>
<div id="info">
    <p>Move with WASD or arrow keys</p>
    <button id="resetBtn" onclick="startGame(); this.style.display='none';">Reset</button>
</div>
<script>

var myGamePiece;
var myObstacles = [];
var myScore;
var mySound;
var myMusic;
var myBackground;

function startGame() {
    myGamePiece = new component(64, 64, ["kirb1.png", "kirb2.png"], 10, 120,"image");
    myGamePiece.frameSpeed = 10;
    myBackground = new component(480, 270, "night.png", 0, 0, "background");
    myScore = new component("15px", "myFont", "white", 320, 30, "text");
    mySound = new sound("bounce.wav");
    myMusic = new sound("background.mp3");
       myMusic.sound.loop = true
    myMusic.play();
    myGameArea.start();
}
var SCALE = 2;
var myGameArea = {
    canvas : document.createElement("canvas"),
    width : 480,    
    height : 270,
    start : function() {
        this.canvas.width = this.width * SCALE;
        this.canvas.height = this.height * SCALE;
        this.context = this.canvas.getContext("2d");
        this.context.scale(SCALE, SCALE);  
        this.context.imageSmoothingEnabled = false;
        document.body.insertBefore(this.canvas, document.body.childNodes[0]);
        this.frameNo = 0;
        this.interval = setInterval(updateGameArea, 20);
    },
    stop : function() {
        clearInterval(this.interval);
    },
    clear : function() {
        this.context.clearRect(0, 0, this.width, this.height);
    }
}
function component(width, height, color, x, y, type) {
    this.type = type;
    if (type == "image" || type == "background") {
        this.images = [].concat(color).map(function (src) {
            var img = new Image();
            img.src = src;
            return img;
        });
    }
    this.frame = 0;
    this.frameSpeed = 10;
    this.width = width;
    this.height = height;
    this.speedX = 0;
    this.speedY = 0;
    this.x = x;
    this.y = y;

    this.update = function() {
        ctx = myGameArea.context;
        if (this.type == "text") {
            ctx.font = this.width + " " + this.height;
            ctx.fillStyle = color;
            ctx.fillText(this.text, this.x, this.y);

        } else if (this.type == "background") {
            var bg = this.images[0];
            if (bg.complete && bg.naturalWidth > 0) {
                
                ctx.drawImage(bg, this.x, this.y, this.width, this.height);
                ctx.drawImage(bg, this.x + this.width, this.y, this.width, this.height);
            }

        } else if (this.type == "image") {
            var img = this.images[this.frame];
            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, this.x, this.y, this.width, this.height);
            }
            if (this.images.length > 1 && myGameArea.frameNo % this.frameSpeed == 0) {
                this.frame = (this.frame + 1) % this.images.length;
            }

        } else {
            ctx.fillStyle = color;
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }
    }

    this.newPos = function() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.type == "background") {
            if (this.x <= -this.width) {
                this.x = 0;  
            }
        }
    }

    this.crashWith = function(otherobj) {
        var myleft = this.x;
        var myright = this.x + (this.width);
        var mytop = this.y;
        var mybottom = this.y + (this.height);
        var otherleft = otherobj.x;
        var otherright = otherobj.x + (otherobj.width);
        var othertop = otherobj.y;
        var otherbottom = otherobj.y + (otherobj.height);
        var crash = true;
        if ((mybottom < othertop) || (mytop > otherbottom) || (myright < otherleft) || (myleft > otherright)) {
            crash = false;
        }
        return crash;
    }
}

function updateGameArea() {
    var x, height, gap, minHeight, maxHeight, minGap, maxGap;
    for (i = 0; i < myObstacles.length; i += 1) {
        if (myGamePiece.crashWith(myObstacles[i])) {
            mySound.play();
            myMusic.stop();
            myGameArea.stop();
            return;
        } 
    }
    myGameArea.clear();
    myBackground.speedX = -1;
    myBackground.newPos();
    myBackground.update();
    myGameArea.frameNo += 1;
    if (myGameArea.frameNo == 1 || everyinterval(150)) {
        x = myGameArea.width;
        minHeight = 20;
        maxHeight = 200;
        height = Math.floor(Math.random()*(maxHeight-minHeight+1)+minHeight);
        minGap = 80;
        maxGap = 220;
        gap = Math.floor(Math.random()*(maxGap-minGap+1)+minGap);
        myObstacles.push(new component(10, height, "yellow", x, 0));
       myObstacles.push(new component(10, myGameArea.height - height - gap, "yellow", x, height + gap));
    }
    for (i = 0; i < myObstacles.length; i += 1) {
        myObstacles[i].x -= 1;
        myObstacles[i].update();
    }
    myScore.text = "SCORE: " + myGameArea.frameNo;
    myScore.update();
    myGamePiece.newPos();
    myGamePiece.update();
}

function sound(src) {
    this.sound = document.createElement("audio");
    this.sound.src = src;
    this.sound.setAttribute("preload", "auto");
    this.sound.setAttribute("controls", "none");
    this.sound.style.display = "none";
    document.body.appendChild(this.sound);
    this.play = function(){
        this.sound.play();
    }
    this.stop = function(){
        this.sound.pause();
    }    
}

function everyinterval(n) {
    if ((myGameArea.frameNo / n) % 1 == 0) {return true;}
    return false;
}

function moveup() {
    myGamePiece.speedY = -1; 
}

function movedown() {
    myGamePiece.speedY = 1; 
}

function moveleft() {
    myGamePiece.speedX = -1; 
}

function moveright() {
    myGamePiece.speedX = 1; 
}

function clearmove() {
    myGamePiece.speedX = 0; 
    myGamePiece.speedY = 0; 
}
var keys = {};

window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    keys[k] = true;
    updateMovement();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) {
        e.preventDefault();
    }
});

window.addEventListener("keyup", function (e) {
    keys[e.key.toLowerCase()] = false;
    updateMovement();
});

function updateMovement() {

    if (!myGamePiece) return;

    myGamePiece.speedX = 0;
    myGamePiece.speedY = 0;

    if (keys["a"] || keys["arrowleft"])  myGamePiece.speedX = -1;
    if (keys["d"] || keys["arrowright"]) myGamePiece.speedX = 1;
    if (keys["w"] || keys["arrowup"])    myGamePiece.speedY = -1;
    if (keys["s"] || keys["arrowdown"])  myGamePiece.speedY = 1;
}



</script>
</body>
</html>
